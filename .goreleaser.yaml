# GoReleaser builds the binaries, the container images and the Homebrew
# formula for a tagged release. Run `make snapshot` to exercise it locally
# without publishing anything.
version: 2

project_name: ferry

before:
  hooks:
    - go mod tidy
    - go mod verify

builds:
  - id: ferry
    main: ./cmd/ferry
    binary: ferry
    env:
      # The SQLite driver is pure Go, so no C toolchain is needed and every
      # target cross-compiles from one machine.
      - CGO_ENABLED=0
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/LucasStbnr/ferry/internal/cli.version={{ .Version }}
      - -X github.com/LucasStbnr/ferry/internal/cli.commit={{ .ShortCommit }}
      - -X github.com/LucasStbnr/ferry/internal/cli.date={{ .CommitDate }}
    mod_timestamp: "{{ .CommitTimestamp }}"   # reproducible archives

archives:
  - id: ferry
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - README.md
      - LICENSE
      - CHANGELOG.md
      - src: docs/*.md
        dst: docs

checksum:
  name_template: checksums.txt

sboms:
  - artifacts: archive

signs:
  # Keyless signing through Sigstore: the signature is verifiable against the
  # GitHub Actions identity that produced it, with no key to manage.
  #
  # One bundle carries the signature, the certificate and the transparency log
  # proof together. Current cosign writes that format by default and ignores
  # --output-signature and --output-certificate, which leaves --bundle unset
  # and the signing step fails on an empty path rather than falling back.
  - cmd: cosign
    signature: "${artifact}.bundle"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum
    output: true

# One entry builds and pushes every platform, and the manifest with it.
dockers_v2:
  - id: ferry
    images:
      - ghcr.io/lucasstbnr/ferry
    tags:
      - "{{ .Version }}"
      - "{{ .Major }}.{{ .Minor }}"
      - latest
    platforms:
      - linux/amd64
      - linux/arm64
    dockerfile: Dockerfile.release
    labels:
      org.opencontainers.image.title: "{{ .ProjectName }}"
      org.opencontainers.image.description: IMAP and SMTP bridge for Resend
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.created: "{{ .Date }}"
      org.opencontainers.image.source: https://github.com/LucasStbnr/ferry
      org.opencontainers.image.licenses: MIT

homebrew_casks:
  - name: ferry
    binaries:
      - ferry
    repository:
      owner: LucasStbnr
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Casks
    homepage: https://github.com/LucasStbnr/ferry
    description: IMAP and SMTP bridge that puts a Resend account into any mail client
    license: MIT
    commit_author:
      name: goreleaser
      email: noreply@github.com

    hooks:
      post:
        # The release binaries are not notarised, so macOS quarantines them and
        # Gatekeeper refuses to run ferry at all. Clearing the attribute on a
        # binary Homebrew just downloaded over TLS, whose checksum it verified,
        # is what every unsigned CLI cask does.
        install: |
          if system_command("/usr/bin/xattr", args: ["-h"], print_stderr: false).exit_status.zero?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/ferry"]
          end

    # Ferry registers its own LaunchAgent through `ferry service install`, so
    # uninstalling has to unload it. Homebrew does this before removing the
    # binary the agent points at.
    uninstall:
      launchctl:
        - io.github.lucasstbnr.ferry

    # `brew uninstall --zap` also removes the mail store. It is not part of a
    # normal uninstall, because that store is the only copy of the read state,
    # folders and drafts.
    zap:
      trash:
        - ~/Library/Application Support/ferry
        - ~/Library/LaunchAgents/io.github.lucasstbnr.ferry.plist

    caveats: |
      Ferry serves IMAP and SMTP over TLS on loopback, for any mail client.

      Getting started:

        ferry account add mysite      add a Resend account; the app password
                                      is printed once
        ferry trust                   trust Ferry's local certificate so mail
                                      clients connect without a warning
        ferry service install         run it in the background from now on

      On macOS, `ferry mail-profile --open` configures Apple Mail in one
      double-click. Any other client is set up by hand against localhost;
      `ferry account add` prints the ports and credentials.

      Mail is stored under
        ~/Library/Application Support/ferry

      That directory is the only copy of your read state, folders and drafts:
      Resend does not store them. Back it up, and keep FileVault on.

release:
  draft: false
  prerelease: auto
  footer: |
    ## Install

    Homebrew:

        brew install --cask LucasStbnr/tap/ferry

    Docker:

        docker pull ghcr.io/lucasstbnr/ferry:{{ .Version }}

    ## Verify

    `checksums.txt` is signed with Sigstore, keyless, against this repository's
    release workflow. There is no key to fetch:

        cosign verify-blob checksums.txt \
          --bundle checksums.txt.bundle \
          --certificate-identity-regexp '^https://github.com/LucasStbnr/ferry/' \
          --certificate-oidc-issuer https://token.actions.githubusercontent.com

    **Full changelog**: https://github.com/LucasStbnr/ferry/compare/{{ .PreviousTag }}...{{ .Tag }}

changelog:
  use: github
  sort: asc
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: Fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: Performance
      regexp: '^.*?perf(\(.+\))??!?:.+$'
      order: 2
    - title: Other
      order: 99
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
      - Merge pull request
      - Merge branch
