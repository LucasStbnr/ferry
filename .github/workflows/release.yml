name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # create the GitHub release
  packages: write   # push to GHCR
  id-token: write   # keyless signing

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # GoReleaser needs the full history for the changelog

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      # GoReleaser shells out to both of these and the action installs neither:
      # syft builds the SBOMs, cosign signs the checksums against this job's
      # OIDC identity. Without them the release fails after building.
      - uses: anchore/sbom-action/download-syft@v0
      - uses: sigstore/cosign-installer@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run tests before releasing
        run: go test ./...

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # A personal access token with contents:write on LucasStbnr/homebrew-tap.
          # Without it the Homebrew cask is built but not published.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
